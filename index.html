<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel general · Ciclo Térmico BB · San Fernando</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  window.PAGE = "dashboard";
  window.PAGE_TITLE = "Panel general";
  window.PAGE_SUBTITLE = "Estado en vivo del ciclo térmico: planta de incubación → tránsito → granja";
</script>

<template id="tpl-content">
  <div class="section-title">
    <span class="eyebrow">HOY</span> Unidades del día
  </div>
  <div class="grid grid-4" id="fleet-row"></div>

  <div class="section-title">
    <span class="eyebrow">HOY</span> Temperatura cloacal
  </div>
  <div class="card" id="temp-hoy-card" style="margin-bottom:16px;"></div>

  <div class="section-title">
    <span class="eyebrow">CICLO</span> Cinta térmica del último viaje finalizado
  </div>
  <div class="card" id="ribbon-card"></div>

  <div class="section-title">
    <span class="eyebrow">HOY</span> Viajes programados y en curso
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>D.T. SAP</th>
          <th>Ruta</th>
          <th>Destino</th>
          <th>Unidad / Placa</th>
          <th>Estado</th>
          <th>Salida prog.</th>
          <th>Salida real</th>
          <th class="num">Temp. carga</th>
          <th class="num">Temp. llegada</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="trips-body"></tbody>
    </table>
  </div>
</template>

<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script src="js/thermal-ribbon.js"></script>
<script>
  window.initPage = function () {
    document.getElementById("page-content").appendChild(
      document.getElementById("tpl-content").content.cloneNode(true)
    );

    const viajes = Store.getViajes();
    const finalizados = viajes.filter((v) => v.estado === "Finalizado" || v.estado === "En Granja");

    // Datos transversales del día: todos los viajes con fecha = hoy,
    // sin importar su estado actual.
    const hoyISO = new Date().toISOString().slice(0, 10);
    const viajesHoy = viajes.filter((v) => v.fecha === hoyISO);

    // ---- Unidades del día (gráfico simple: 1 ícono de camión por estado) ----
    const FLEET_TRUCK_SVG = `
      <svg viewBox="0 0 48 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="6" width="27" height="15" rx="2" fill="currentColor" opacity="0.15"/>
        <rect x="1" y="6" width="27" height="15" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M28 12H37L45 19V21H28V12Z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="11" cy="24" r="3.4" fill="#fff" stroke="currentColor" stroke-width="2"/>
        <circle cx="38" cy="24" r="3.4" fill="#fff" stroke="currentColor" stroke-width="2"/>
        <line x1="1" y1="21" x2="45" y2="21" stroke="currentColor" stroke-width="2"/>
      </svg>`;

    const FLEET_TILES = [
      { label: "Programadas", color: "var(--text-muted)", count: viajesHoy.filter((v) => v.estado === "Programado").length },
      { label: "En planta", color: "var(--accent-warn)", count: viajesHoy.filter((v) => v.estado === "En Carga").length },
      { label: "En trayecto", color: "var(--accent-info)", count: viajesHoy.filter((v) => v.estado === "En Tránsito").length },
      { label: "En granja", color: "var(--accent-cool)", count: viajesHoy.filter((v) => v.estado === "En Granja" || v.estado === "Finalizado").length },
    ];

    document.getElementById("fleet-row").innerHTML = FLEET_TILES.map(
      (t) => `
      <div class="card fleet-tile">
        <div class="fleet-icon" style="color:${t.color}">${FLEET_TRUCK_SVG}</div>
        <div>
          <div class="fleet-count" style="color:${t.color}">${t.count}</div>
          <div class="fleet-label">${t.label}</div>
        </div>
      </div>`
    ).join("");

    // ---- Temperatura cloacal — hoy (transversal a todos los viajes del día) ----
    const tempsCargaHoy = viajesHoy.flatMap((v) => v.cargaPlanta.muestras.map((m) => m.tempCloacal));
    const tempsLlegadaHoy = viajesHoy.filter((v) => v.granja).flatMap((v) => v.granja.muestrasLlegada.map((m) => m.tempCloacal));
    const mortalidadHoy = Store.promedio(viajesHoy.filter((v) => v.granja).map((v) => v.granja.mortalidad));

    function miniStat(label, valor) {
      return `<div class="mini-stat">
        <div class="mini-stat-label">${label}</div>
        ${valor != null ? Util.badgeTemp(valor) : '<span class="badge sin-dato">Sin dato</span>'}
      </div>`;
    }

    document.getElementById("temp-hoy-card").innerHTML = `
      <div class="card-head">
        <h3>Temperatura cloacal</h3>
        <span class="hint">Máximo · mínimo · promedio — transversal a todos los viajes de hoy</span>
      </div>
      <div class="grid grid-2 temp-groups">
        <div class="temp-group">
          <div class="temp-group-title">En planta (salida)</div>
          <div class="mini-stat-row">
            ${miniStat("Máximo", Store.maximo(tempsCargaHoy))}
            ${miniStat("Mínimo", Store.minimo(tempsCargaHoy))}
            ${miniStat("Promedio", Store.promedio(tempsCargaHoy))}
          </div>
          <div class="faint" style="font-size:11px; margin-top:12px;">${tempsCargaHoy.length} muestras registradas hoy</div>
        </div>
        <div class="temp-group">
          <div class="temp-group-title">En granja (llegada)</div>
          <div class="mini-stat-row">
            ${miniStat("Máximo", Store.maximo(tempsLlegadaHoy))}
            ${miniStat("Mínimo", Store.minimo(tempsLlegadaHoy))}
            ${miniStat("Promedio", Store.promedio(tempsLlegadaHoy))}
          </div>
          <div class="faint" style="font-size:11px; margin-top:12px;">${tempsLlegadaHoy.length} muestras hoy · Mortalidad prom. ${mortalidadHoy != null ? mortalidadHoy.toFixed(2) + "%" : "—"}</div>
        </div>
      </div>
    `;

    // ---- Cinta térmica del último finalizado ----
    const ultimo = viajes.find((v) => v.estado === "Finalizado") || finalizados[0];
    const ribbonCard = document.getElementById("ribbon-card");
    if (ultimo) {
      const promC = Store.promedio(ultimo.cargaPlanta.muestras.map((m) => m.tempCloacal));
      const promL = ultimo.granja ? Store.promedio(ultimo.granja.muestrasLlegada.map((m) => m.tempCloacal)) : null;
      ribbonCard.innerHTML = `<div class="card-head">
        <h3>${ultimo.dtSap} · ${ultimo.destino1} · ${ultimo.placa}</h3>
        <span class="hint">Lote ${ultimo.edadLotes}</span>
      </div><div id="ribbon-target"></div>`;
      renderThermalRibbon(document.getElementById("ribbon-target"), [
        { label: "Salida planta", sub: Util.fmtHora(ultimo.horaSalidaReal || ultimo.horaSalidaPlan), temp: promC },
        { label: "Tránsito (amb.)", sub: "unidad temperada", temp: Store.promedio(ultimo.transito.serie.map((s) => s.temp)) },
        { label: "Llegada granja", sub: Util.fmtHora(ultimo.horaLlegadaReal), temp: promL },
      ]);
    } else {
      ribbonCard.innerHTML = `<div class="empty-state">Aún no hay viajes finalizados con datos completos.</div>`;
    }

    // ---- Tabla de viajes ----
    const tbody = document.getElementById("trips-body");
    tbody.innerHTML = viajes
      .map((v) => {
        const promC = Store.promedio(v.cargaPlanta.muestras.map((m) => m.tempCloacal));
        const promL = v.granja ? Store.promedio(v.granja.muestrasLlegada.map((m) => m.tempCloacal)) : null;
        return `
        <tr>
          <td class="mono">${v.dtSap}</td>
          <td>${v.ruta}</td>
          <td>${v.destino1}</td>
          <td>${v.unidad} · ${v.placa}</td>
          <td>${Util.badgeEstado(v.estado)}</td>
          <td class="mono">${Util.fmtHora(v.horaSalidaPlan)}</td>
          <td class="mono">${v.horaSalidaReal ? Util.fmtHora(v.horaSalidaReal) : "—"}</td>
          <td class="num">${promC != null ? Util.badgeTemp(promC) : "—"}</td>
          <td class="num">${promL != null ? Util.badgeTemp(promL) : "—"}</td>
          <td><a class="btn btn-sm btn-ghost" href="viaje.html?id=${v.id}">Ver ciclo →</a></td>
        </tr>`;
      })
      .join("");
  };
</script>
<script src="js/nav.js"></script>
</body>
</html>
