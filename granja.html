<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recepción en granja · Ciclo Térmico BB</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  window.PAGE = "granja";
  window.PAGE_TITLE = "③ Recepción en granja";
  window.PAGE_SUBTITLE = "Checklist de preparación de galpón y control de llegada: mortalidad, temperatura cloacal, peso y uniformidad";
</script>

<template id="tpl-content">
  <div class="field" style="max-width:520px;">
    <label>Unidad a recepcionar</label>
    <select id="select-viaje"></select>
  </div>
  <div id="viaje-detalle" class="faint" style="font-size:12.5px; margin:6px 0 20px;"></div>

  <div class="two-col">
    <div class="card">
      <div class="card-head"><h3>Checklist de preparación de galpón</h3><span class="hint">FICYB004 v2</span></div>
      <div id="g-checklist-lista"></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Complex</h3></div>

      <div class="grid grid-2">
        <div class="field"><label>Plantel (Granja)</label><input class="mono" id="g-plantel" readonly /></div>
        <div class="field"><label>Galpón <span class="req">*</span></label><input class="mono" id="g-lote-galpon" placeholder="G-08" /></div>
        <div class="field"><label>Campaña</label><input class="mono" id="g-campana" readonly /></div>
        <div class="field"><label>Sexo del galpón <span class="req">*</span></label>
          <select id="g-sexo-galpon">
            <option value="">— Selecciona —</option>
            <option value="macho">Macho</option>
            <option value="hembra">Hembra</option>
          </select>
        </div>
      </div>
      <p class="faint" style="font-size:11px; margin:-6px 0 10px;">Plantel y campaña vienen de la programación (SAP); SAP no llega a detalle de galpón, así que el galpón y el sexo del grupo se registran acá, al recepcionarlo.</p>
      <div class="field">
        <label>Código complex <span class="req">*</span></label>
        <input class="mono" id="g-complex-codigo" readonly style="font-weight:700;" />
      </div>
      <p class="faint" id="g-complex-hint" style="font-size:11px; margin:-6px 0 0;">Se confirma al guardar el control de llegada de este grupo.</p>

      <h3 style="font-size:13px; margin:14px 0 8px;">Sexo del lote</h3>
      <div class="grid grid-2">
        <div class="field"><label>Cantidad F (hembras)</label><input class="mono" type="number" step="1" min="0" id="g-sexo-f" placeholder="5000" /></div>
        <div class="field"><label>Cantidad M (machos)</label><input class="mono" type="number" step="1" min="0" id="g-sexo-m" placeholder="5000" /></div>
        <div class="field"><label>Total del lote</label><input class="mono" id="g-sexo-total" readonly /></div>
      </div>

      <h3 style="font-size:13px; margin:14px 0 8px;">Mortalidad durante el transporte</h3>
      <div class="grid grid-2">
        <div class="field"><label>Cantidad despachada (según programación)</label><input class="mono" id="g-despachada" readonly /></div>
        <div class="field"><label>Muertos durante el trayecto</label><input class="mono" type="number" step="1" min="0" id="g-muertos" placeholder="25" /></div>
        <div class="field"><label>Mortalidad (%) — calculada</label><input class="mono" id="g-mortalidad" readonly /></div>
        <div class="field"><label>Uniformidad calculada (%)</label><input class="mono" id="g-uniformidad" readonly /></div>
      </div>
      <p class="faint" id="msg-validacion" style="margin:6px 0 0; font-size:12px; color:#c0392b;"></p>

      <div class="flex-between" style="margin:16px 0 10px;">
        <h3 style="font-size:13px;">Muestras (sexo + temp. cloacal + peso)</h3>
        <button class="btn btn-sm" id="btn-add-muestra" type="button">+ Agregar muestra</button>
      </div>
      <div id="muestras-rows"></div>

      <button class="btn btn-primary" style="margin-top:12px;" id="btn-guardar-llegada" type="button">Guardar control de llegada</button>
      <button class="btn" id="btn-finalizar" type="button">Finalizar ciclo del viaje ✓</button>
      <p class="faint" id="msg" style="margin-top:10px; font-size:12px;"></p>
    </div>
  </div>

  <div class="section-title"><span class="eyebrow">UBICACIÓN</span> Dimensión geográfica y organizacional</div>
  <div class="card">
    <div class="grid grid-4">
      <div class="field"><label>Zona</label><input class="mono" id="g-zona" placeholder="Zona Sur" /></div>
      <div class="field"><label>Subzona</label><input class="mono" id="g-subzona" placeholder="Chincha" /></div>
      <div class="field"><label>Circuito</label><input class="mono" id="g-circuito" placeholder="Circuito 3" /></div>
      <div class="field"><label>Tipo de plantel</label>
        <select id="g-tipo-plantel">
          <option value="">Selecciona…</option>
          <option>Recría</option>
          <option>Engorde</option>
          <option>Reproductoras</option>
        </select>
      </div>
      <div class="field"><label>Supervisor</label><input id="g-supervisor" placeholder="Nombres completos" /></div>
      <div class="field"><label>Coordinador</label><input id="g-coordinador" placeholder="Nombres completos" /></div>
      <div class="field"><label>Franquicia</label><input class="mono" id="g-franquicia" placeholder="San Fernando" /></div>
    </div>
    <button class="btn" id="btn-guardar-ubicacion" type="button">Guardar dimensión geográfica y organizacional</button>
  </div>

  <div class="section-title"><span class="eyebrow">CICLO</span> Cinta térmica completa (planta → tránsito → granja)</div>
  <div class="card" id="ribbon-cont"></div>
</template>

<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script src="js/thermal-ribbon.js"></script>
<script>
  let muestraSeq = 1;
  let muestras = [];

  function pesoUniformidad(pesos) {
    // Uniformidad = % de aves dentro de ±10% del peso promedio del lote
    const prom = Store.promedio(pesos);
    if (prom == null) return null;
    const dentro = pesos.filter((p) => Math.abs(p - prom) <= prom * 0.1).length;
    return (dentro / pesos.length) * 100;
  }

  function pintarMuestras() {
    document.getElementById("muestras-rows").innerHTML = muestras
      .map(
        (m, idx) => `
      <div class="flex gap-8 wrap" style="margin-bottom:8px;" data-row="${m._id}">
        <input class="mono" style="width:64px;" value="M${idx + 1}" disabled />
        <select class="mono s-input" style="width:70px;">
          <option value="" ${!m.sexo ? "selected" : ""}>Sexo</option>
          <option value="F" ${m.sexo === "F" ? "selected" : ""}>F</option>
          <option value="M" ${m.sexo === "M" ? "selected" : ""}>M</option>
        </select>
        <input class="mono t-input" type="number" step="0.1" placeholder="Temp °C" value="${m.tempCloacal ?? ""}" style="width:100px;" />
        <input class="mono p-input" type="number" step="0.5" placeholder="Peso g" value="${m.pesoG ?? ""}" style="width:100px;" />
        <button class="btn btn-sm btn-ghost" type="button" data-remove="${m._id}">✕</button>
      </div>`
      )
      .join("");

    document.querySelectorAll(".s-input").forEach((sel, idx) => {
      sel.addEventListener("change", () => { muestras[idx].sexo = sel.value || null; });
    });
    document.querySelectorAll(".t-input").forEach((inp, idx) => {
      inp.addEventListener("input", () => { muestras[idx].tempCloacal = inp.value ? parseFloat(inp.value) : null; recalc(); });
    });
    document.querySelectorAll(".p-input").forEach((inp, idx) => {
      inp.addEventListener("input", () => { muestras[idx].pesoG = inp.value ? parseFloat(inp.value) : null; recalc(); });
    });
    document.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        muestras = muestras.filter((m) => m._id !== btn.getAttribute("data-remove"));
        pintarMuestras(); recalc();
      });
    });
  }

  function recalc() {
    const pesos = muestras.map((m) => m.pesoG).filter((p) => p != null);
    const uni = pesoUniformidad(pesos);
    document.getElementById("g-uniformidad").value = uni != null ? uni.toFixed(1) + "%" : "";
  }

  // --- Sexo del lote: total siempre calculado, nunca editable ---
  function recalcSexoLote() {
    const f = parseInt(document.getElementById("g-sexo-f").value, 10);
    const m = parseInt(document.getElementById("g-sexo-m").value, 10);
    const total = (!isNaN(f) ? f : 0) + (!isNaN(m) ? m : 0);
    document.getElementById("g-sexo-total").value = (!isNaN(f) || !isNaN(m)) ? total : "";
  }

  // --- Mortalidad: el usuario solo ingresa "muertos"; el % siempre se calcula ---
  function recalcMortalidad() {
    const despachada = parseFloat(document.getElementById("g-despachada").value);
    const muertos = parseFloat(document.getElementById("g-muertos").value);
    const pct = Store.calcularMortalidad(muertos, despachada);
    document.getElementById("g-mortalidad").value = pct != null ? pct.toFixed(2) + "%" : "";
  }

  function leerControlLlegadaForm() {
    const fRaw = document.getElementById("g-sexo-f").value;
    const mRaw = document.getElementById("g-sexo-m").value;
    return {
      f: fRaw !== "" ? parseInt(fRaw, 10) : null,
      m: mRaw !== "" ? parseInt(mRaw, 10) : null,
      total: (fRaw !== "" || mRaw !== "") ? (parseInt(fRaw, 10) || 0) + (parseInt(mRaw, 10) || 0) : null,
      cantidadDespachada: document.getElementById("g-despachada").value !== "" ? parseFloat(document.getElementById("g-despachada").value) : null,
      muertosTraslado: document.getElementById("g-muertos").value !== "" ? parseFloat(document.getElementById("g-muertos").value) : null,
    };
  }

  window.initPage = function () {
    document.getElementById("page-content").appendChild(
      document.getElementById("tpl-content").content.cloneNode(true)
    );

    const select = document.getElementById("select-viaje");
    // Solo unidades que ya llegaron a granja — mientras están cargando en
    // planta o en tránsito, no corresponde recepcionarlas todavía.
    function refrescarListaViajes(seleccionarId) {
      const enGranja = Store.getViajes().filter((v) => v.estado === "En Granja");
      Util.fillSelectViajes(select, enGranja, { placeholder: "Selecciona una unidad…" });
      select.value = enGranja.some((v) => v.id === seleccionarId) ? seleccionarId : "";
    }
    const preId = Util.qs("id");
    refrescarListaViajes(preId || (Store.getViajes().find((v) => v.estado === "En Granja") || {}).id || "");

    // Galpón y sexo se digitan acá (SAP no llega a ese detalle): el
    // complex y el cruce con el checklist de ese galpón se arman en vivo
    // con lo que se va escribiendo en este formulario.
    function actualizarComplexYChecklist(v, complexConfirmado) {
      const galpon = document.getElementById("g-lote-galpon").value.trim();
      const sexo = document.getElementById("g-sexo-galpon").value;

      const complexPreview = Store.construirComplex({ destino: v.destino1, anio: v.anioCampana, rueda: v.rueda, galpon, sexo });
      document.getElementById("g-complex-codigo").value = complexConfirmado || complexPreview || "";
      document.getElementById("g-complex-hint").textContent = complexConfirmado
        ? "Confirmado en la última recepción guardada."
        : complexPreview
        ? 'Vista previa — se confirma al presionar "Guardar control de llegada".'
        : "Completa Galpón, Sexo, y verifica año/rueda/código de plantel para generar el complex.";

      const contChecklist = document.getElementById("g-checklist-lista");
      if (!galpon) {
        contChecklist.innerHTML = `<div class="empty-state">Escribe el Galpón para ver el estado de su checklist de preparación.</div>`;
        return;
      }
      const estado = Store.clasificarChecklist(Store.getChecklist(v.destino1, galpon));
      const href = `checklist.html?plantel=${encodeURIComponent(v.destino1)}&galpon=${encodeURIComponent(galpon)}`;
      contChecklist.innerHTML = `
        <div class="flex-between wrap" style="padding:10px 0; gap:8px;">
          <div style="font-size:12.5px;"><strong>${v.destino1}</strong> · Galpón ${galpon}</div>
          <div class="flex gap-8" style="align-items:center;">
            <span class="badge ${Store.CHECKLIST_ESTADO_BADGE[estado]}">${Store.CHECKLIST_ESTADO_LABEL[estado]}</span>
            <a class="btn btn-sm btn-ghost" href="${href}">Ver checklist →</a>
          </div>
        </div>`;
    }

    let viajeActual = null;

    function cargar() {
      const v = Store.getViaje(select.value);
      viajeActual = v;
      const det = document.getElementById("viaje-detalle");
      if (!v) { det.textContent = ""; document.getElementById("g-checklist-lista").innerHTML = ""; muestras = []; pintarMuestras(); recalc(); dibujarRibbon(null); return; }

      det.innerHTML = `${v.dtSap} · ${v.destino1} · Lote ${v.edadLotes} · Unidad ${v.unidad} · ${Util.badgeEstado(v.estado)}`;

      const g = v.granja;
      const ubic = g?.ubicacionOrganizacional;
      document.getElementById("g-zona").value = ubic?.zona || "";
      document.getElementById("g-subzona").value = ubic?.subzona || "";
      document.getElementById("g-circuito").value = ubic?.circuito || "";
      document.getElementById("g-tipo-plantel").value = ubic?.tipoPlantel || "";
      document.getElementById("g-supervisor").value = ubic?.supervisor || "";
      document.getElementById("g-coordinador").value = ubic?.coordinador || "";
      document.getElementById("g-franquicia").value = ubic?.franquicia || "";

      // Plantel y campaña ya viajan desde la programación (SAP). SAP no
      // llega a detalle de galpón, así que galpón y sexo del grupo se
      // digitan acá — se sugiere el último valor recepcionado, si hay.
      const lote = g?.loteRecepcion;
      document.getElementById("g-plantel").value = v.destino1 ?? "";
      document.getElementById("g-lote-galpon").value = lote?.galpon ?? v.galpon ?? "";
      document.getElementById("g-campana").value = v.edadLotes ?? "";
      document.getElementById("g-sexo-galpon").value = lote?.sexoGalpon ?? v.sexoGalpon ?? "";
      actualizarComplexYChecklist(v, lote?.complex);
      document.getElementById("g-sexo-f").value = lote?.sexo?.F ?? "";
      document.getElementById("g-sexo-m").value = lote?.sexo?.M ?? "";
      document.getElementById("g-despachada").value = v.cantidad ?? "";
      document.getElementById("g-muertos").value = lote?.transporte?.muertosTraslado ?? "";
      recalcSexoLote();
      recalcMortalidad();
      document.getElementById("msg-validacion").textContent = "";

      muestras = (g?.muestrasLlegada || []).map((m) => ({ _id: "m" + muestraSeq++, tempCloacal: m.tempCloacal, pesoG: m.pesoG, sexo: m.sexo || null }));
      if (!muestras.length) muestras = [1, 2, 3].map(() => ({ _id: "m" + muestraSeq++, tempCloacal: null, pesoG: null, sexo: null }));
      pintarMuestras();
      recalc();
      dibujarRibbon(v);
    }

    function dibujarRibbon(v) {
      const cont = document.getElementById("ribbon-cont");
      if (!v) { cont.innerHTML = `<div class="empty-state">Selecciona una unidad.</div>`; return; }
      const promC = Store.promedio(v.cargaPlanta.muestras.map((m) => m.tempCloacal));
      const promAmb = Store.promedio(v.transito.serie.map((s) => s.temp));
      const promL = Store.promedio(muestras.map((m) => m.tempCloacal).filter((t) => t != null));
      cont.innerHTML = "";
      renderThermalRibbon(cont, [
        { label: "Salida planta", sub: Util.fmtHora(v.horaSalidaReal || v.horaSalidaPlan), temp: promC },
        { label: "Tránsito (amb.)", sub: "unidad temperada", temp: promAmb },
        { label: "Llegada granja", sub: Util.fmtHora(v.horaLlegadaReal), temp: promL },
      ]);
    }

    select.addEventListener("change", cargar);
    cargar();

    document.getElementById("g-sexo-f").addEventListener("input", recalcSexoLote);
    document.getElementById("g-sexo-m").addEventListener("input", recalcSexoLote);
    document.getElementById("g-muertos").addEventListener("input", recalcMortalidad);

    document.getElementById("g-lote-galpon").addEventListener("input", () => {
      if (viajeActual) actualizarComplexYChecklist(viajeActual, null);
    });
    document.getElementById("g-sexo-galpon").addEventListener("change", () => {
      if (viajeActual) actualizarComplexYChecklist(viajeActual, null);
    });

    document.getElementById("btn-add-muestra").addEventListener("click", () => {
      muestras.push({ _id: "m" + muestraSeq++, tempCloacal: null, pesoG: null, sexo: null });
      pintarMuestras();
    });

    function guardarUbicacion() {
      const v = Store.getViaje(select.value);
      if (!v) { alert("Selecciona una unidad."); return null; }
      const granja = v.granja || {};
      granja.ubicacionOrganizacional = {
        zona: document.getElementById("g-zona").value,
        subzona: document.getElementById("g-subzona").value,
        circuito: document.getElementById("g-circuito").value,
        tipoPlantel: document.getElementById("g-tipo-plantel").value,
        supervisor: document.getElementById("g-supervisor").value,
        coordinador: document.getElementById("g-coordinador").value,
        franquicia: document.getElementById("g-franquicia").value,
      };
      return Store.updateViaje(v.id, { granja });
    }

    function guardarLlegada() {
      const v = Store.getViaje(select.value);
      if (!v) { alert("Selecciona una unidad."); return null; }

      const form = leerControlLlegadaForm();
      const { ok, errores } = Store.validarControlLlegada(form);
      const msgVal = document.getElementById("msg-validacion");
      if (!ok) {
        msgVal.textContent = "⚠ " + errores.join(" · ");
        return null;
      }
      msgVal.textContent = "";

      const mortalidadPct = Store.calcularMortalidad(form.muertosTraslado, form.cantidadDespachada);

      const muestrasLlegada = muestras
        .filter((m) => m.tempCloacal != null)
        .map((m, idx) => ({ n: idx + 1, tempCloacal: m.tempCloacal, pesoG: m.pesoG, sexo: m.sexo || null }));
      const pesos = muestrasLlegada.map((m) => m.pesoG).filter((p) => p != null);

      const galponRecepcion = document.getElementById("g-lote-galpon").value.trim();
      const sexoGalponRecepcion = document.getElementById("g-sexo-galpon").value;

      const granja = v.granja || {};
      granja.loteRecepcion = {
        plantel: document.getElementById("g-plantel").value,
        galpon: galponRecepcion,
        sexoGalpon: sexoGalponRecepcion,
        campana: document.getElementById("g-campana").value,
        sexo: { F: form.f, M: form.m, total: form.total },
        transporte: {
          cantidadDespachada: form.cantidadDespachada,
          muertosTraslado: form.muertosTraslado,
          mortalidadPct,
        },
        // Se confirma acá, al recepcionar este grupo — año y rueda vienen
        // de Programación (SAP); galpón y sexo se digitan en este mismo
        // formulario, porque SAP no llega a ese nivel de detalle.
        complex: Store.construirComplex({ destino: v.destino1, anio: v.anioCampana, rueda: v.rueda, galpon: galponRecepcion, sexo: sexoGalponRecepcion }),
      };
      // Se mantiene sincronizado: index.html / bi.html / viaje.html leen granja.mortalidad directo.
      granja.mortalidad = mortalidadPct ?? 0;
      granja.muestrasLlegada = muestrasLlegada;
      granja.pesoPromedioG = pesos.length ? +Store.promedio(pesos).toFixed(1) : null;
      granja.uniformidadPct = pesos.length ? +pesoUniformidad(pesos).toFixed(1) : null;
      return Store.updateViaje(v.id, { granja });
    }

    document.getElementById("btn-guardar-ubicacion").addEventListener("click", () => {
      guardarUbicacion();
      document.getElementById("msg").textContent = "✓ Dimensión geográfica y organizacional guardada.";
    });

    document.getElementById("btn-guardar-llegada").addEventListener("click", () => {
      const v = guardarLlegada();
      if (v) {
        document.getElementById("msg").textContent = "✓ Control de llegada guardado.";
        viajeActual = v;
        actualizarComplexYChecklist(v, v.granja.loteRecepcion.complex);
        dibujarRibbon(Store.getViaje(v.id));
      }
    });

    document.getElementById("btn-finalizar").addEventListener("click", () => {
      guardarUbicacion();
      const v = guardarLlegada();
      if (!v) return;
      Store.updateViaje(v.id, { estado: "Finalizado" });
      document.getElementById("msg").textContent = "✓ Ciclo finalizado. Datos enviados al dashboard BI.";
      // Ya no está "En Granja": sale de la lista de unidades a recepcionar.
      refrescarListaViajes("");
      cargar();
    });
  };
</script>
<script src="js/nav.js"></script>
</body>
</html>
