<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Programación (SAP) · Ciclo Térmico BB</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  window.PAGE = "programacion";
  window.PAGE_TITLE = "Programación de viajes";
  window.PAGE_SUBTITLE = "El área de Transporte carga la programación diaria (4:00 p.m. para el día siguiente) — hoy simulada vía transacción Z de SAP";
</script>

<template id="tpl-content">
  <div class="two-col">
    <div class="card">
      <div class="card-head">
        <h3>Nuevo viaje</h3>
        <span class="hint">Campos = transacción Z-SAP</span>
      </div>
      <form id="form-viaje">
        <div class="grid grid-2">
          <div class="field"><label>Fecha de servicio <span class="req">*</span></label><input type="date" name="fecha" required /></div>
          <div class="field"><label>D.T. (ID viaje SAP) <span class="req">*</span></label><input class="mono" name="dtSap" placeholder="0080012350" required /></div>
          <div class="field"><label>Ruta (SAP)</label><input class="mono" name="ruta" placeholder="R-014" /></div>
          <div class="field"><label>Planta origen <span class="req">*</span></label><input name="planta" placeholder="Planta Incubación Lurín" required /></div>
          <div class="field"><label>Destino 1 <span class="req">*</span></label><input name="destino1" placeholder="Granja Chincha Norte" required /></div>
          <div class="field"><label>Galpón (destino 1)</label><input class="mono" name="galpon" placeholder="G-08" /></div>
          <div class="field"><label>Sexo (galpón 1)</label><select name="sexoGalpon"><option value="">— Selecciona —</option><option value="macho">Macho</option><option value="hembra">Hembra</option></select></div>
          <div class="field"><label>Destino 2</label><input name="destino2" placeholder="Opcional — si el camión descarga en más de un galpón" /></div>
          <div class="field"><label>Galpón (destino 2)</label><input class="mono" name="galpon2" placeholder="Opcional" /></div>
          <div class="field"><label>Sexo (galpón 2)</label><select name="sexoGalpon2"><option value="">— Selecciona —</option><option value="macho">Macho</option><option value="hembra">Hembra</option></select></div>
          <div class="field"><label>Destino 3</label><input name="destino3" placeholder="Opcional" /></div>
          <div class="field"><label>Galpón (destino 3)</label><input class="mono" name="galpon3" placeholder="Opcional" /></div>
          <div class="field"><label>Sexo (galpón 3)</label><select name="sexoGalpon3"><option value="">— Selecciona —</option><option value="macho">Macho</option><option value="hembra">Hembra</option></select></div>
          <div class="field"><label>Año de campaña <span class="req">*</span></label><input class="mono" type="number" name="anioCampana" min="0" max="99" placeholder="26" /></div>
          <div class="field"><label>Rueda (1-4) <span class="req">*</span></label><select name="rueda"><option value="">— Selecciona —</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
          <div class="field"><label>Producto</label><input name="producto" value="Pollo BB" readonly /></div>
          <div class="field"><label>Cantidad producida</label><input class="mono" type="number" name="cantidad" placeholder="24000" /></div>
          <div class="field"><label>Edad / Lotes</label><input name="edadLotes" placeholder="Lote 231-A" /></div>
          <div class="field"><label>Punto de carga</label><input name="puntoCarga" placeholder="Andén 3" /></div>
          <div class="field"><label>Unidad programada</label><input class="mono" name="unidad" placeholder="T-118" /></div>
          <div class="field"><label>Placa</label><input class="mono" name="placa" placeholder="F4X-812" /></div>
          <div class="field"><label>Conductor</label><input name="conductor" placeholder="Nombres completos" /></div>
          <div class="field"><label>Hora salida planta (prog.)</label><input class="mono" type="time" name="horaSalidaPlan" /></div>
          <div class="field"><label>Hora término de carga (prog.)</label><input class="mono" type="time" name="horaCargaFinPlan" /></div>
          <div class="field"><label>Progr. máx. espera en destino (min)</label><input class="mono" type="number" name="esperaMaxMin" placeholder="25" /></div>
          <div class="field"><label>Hora retorno planta (prog.)</label><input class="mono" type="time" name="horaRetornoPlan" /></div>
          <div class="field"><label>Planta de retorno</label><input name="plantaRetorno" placeholder="Planta Incubación Lurín" /></div>
        </div>
        <div id="complex-live-status" class="faint" style="font-size:12.5px; margin-bottom:10px; padding:10px 12px; border:1px dashed var(--border); border-radius:var(--radius-sm);"></div>
        <div id="ck-live-status" class="faint" style="font-size:12.5px; margin:-6px 0 14px; padding:10px 12px; border:1px dashed var(--border); border-radius:var(--radius-sm);"></div>
        <button class="btn btn-primary" type="submit">Cargar programación</button>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h3>Resumen del día</h3></div>
      <div id="resumen-dia"></div>
      <hr class="divider" />
      <div class="card-head"><h3>Datos de origen</h3><span class="hint">as-is → to-be</span></div>
      <p class="muted" style="font-size:12.5px; line-height:1.7;">
        Este formulario reemplaza la carga manual de la hoja de ruta física.
        En producción, estos campos llegan automáticamente desde la
        transacción Z de SAP (programación de las 4:00 p.m.) y el D.T. queda
        como llave para vincular temperatura cloacal, GPS/geocercas y
        registro en granja de cada unidad.
      </p>
    </div>
  </div>

  <div class="section-title"><span class="eyebrow">HOY</span> Viajes programados</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>D.T.</th><th>Fecha</th><th>Ruta</th><th>Origen</th><th>Destino</th>
          <th>Unidad</th><th>Placa</th><th>Conductor</th><th>Salida prog.</th><th>Estado</th>
          <th>Complex</th><th>Checklist galpón</th><th></th>
        </tr>
      </thead>
      <tbody id="body-viajes"></tbody>
    </table>
  </div>
</template>

<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script>
  function checklistBadgeHtml(plantel, galpon) {
    const cl = Store.getChecklist(plantel, galpon);
    const estado = Store.clasificarChecklist(cl);
    const label = Store.CHECKLIST_ESTADO_LABEL[estado];
    const cls = Store.CHECKLIST_ESTADO_BADGE[estado];
    const href = `checklist.html?plantel=${encodeURIComponent(plantel || "")}&galpon=${encodeURIComponent(galpon || "")}`;
    return `<a href="${href}" class="badge ${cls}" style="text-decoration:none;">${label}</a>`;
  }

  window.initPage = function () {
    document.getElementById("page-content").appendChild(
      document.getElementById("tpl-content").content.cloneNode(true)
    );

    const today = new Date().toISOString().slice(0, 10);
    document.querySelector('input[name="fecha"]').value = today;

    // El año de campaña se sugiere a partir de la fecha de servicio (los
    // 2 últimos dígitos del año), pero queda editable por si la campaña
    // del negocio no coincide con el año calendario.
    const inputAnio = document.querySelector('input[name="anioCampana"]');
    function sugerirAnioCampana() {
      const fecha = document.querySelector('input[name="fecha"]').value;
      if (fecha && !inputAnio.value) inputAnio.value = fecha.slice(2, 4);
      actualizarComplexEnVivo();
    }
    document.querySelector('input[name="fecha"]').addEventListener("change", sugerirAnioCampana);

    // --- Complex por galpón: P{plantel}-{año}{rueda}-{galpón}-{sexo} ---
    function galponesFormulario() {
      return [
        { destino: document.querySelector('input[name="destino1"]').value.trim(), galpon: document.querySelector('input[name="galpon"]').value.trim(), sexo: document.querySelector('select[name="sexoGalpon"]').value, label: "Galpón 1" },
        { destino: document.querySelector('input[name="destino2"]').value.trim(), galpon: document.querySelector('input[name="galpon2"]').value.trim(), sexo: document.querySelector('select[name="sexoGalpon2"]').value, label: "Galpón 2" },
        { destino: document.querySelector('input[name="destino3"]').value.trim(), galpon: document.querySelector('input[name="galpon3"]').value.trim(), sexo: document.querySelector('select[name="sexoGalpon3"]').value, label: "Galpón 3" },
      ].filter((g) => g.destino && g.galpon);
    }

    function actualizarComplexEnVivo() {
      const anio = inputAnio.value.trim();
      const rueda = document.querySelector('select[name="rueda"]').value;
      const cont = document.getElementById("complex-live-status");
      const galpones = galponesFormulario();
      if (!galpones.length) {
        cont.innerHTML = "Completa Destino, Galpón, Sexo, Año de campaña y Rueda para generar el código de complex de cada galpón.";
        return;
      }
      cont.innerHTML = galpones
        .map((g) => {
          const complex = Store.construirComplex({ destino: g.destino, anio, rueda, galpon: g.galpon, sexo: g.sexo });
          const sinPlantel = !Store.UBICACION_POR_DESTINO[g.destino];
          if (complex) return `${g.label}: <strong class="mono">${complex}</strong>`;
          if (sinPlantel) return `${g.label}: destino "${g.destino}" sin código de plantel registrado.`;
          return `${g.label}: falta Sexo, Año de campaña o Rueda para generar el complex.`;
        })
        .join("<br/>");
    }

    function actualizarChecklistEnVivo() {
      const pares = Store.destinosGalpones({
        destino1: document.querySelector('input[name="destino1"]').value.trim(),
        galpon: document.querySelector('input[name="galpon"]').value.trim(),
        destino2: document.querySelector('input[name="destino2"]').value.trim(),
        galpon2: document.querySelector('input[name="galpon2"]').value.trim(),
        destino3: document.querySelector('input[name="destino3"]').value.trim(),
        galpon3: document.querySelector('input[name="galpon3"]').value.trim(),
      }).filter((p) => p.galpon);
      const cont = document.getElementById("ck-live-status");
      if (!pares.length) {
        cont.innerHTML = "Escribe Destino y Galpón (uno por cada galpón donde descarga el camión) para ver el estado de sus checklists de preparación.";
        return;
      }
      cont.innerHTML = pares
        .map((p) => `Checklist de <strong>${p.destino} · ${p.galpon}</strong>: ${checklistBadgeHtml(p.destino, p.galpon)}`)
        .join("<br/>");
    }
    ["destino1", "galpon", "destino2", "galpon2", "destino3", "galpon3"].forEach((name) => {
      document.querySelector(`input[name="${name}"]`).addEventListener("input", actualizarChecklistEnVivo);
    });
    actualizarChecklistEnVivo();

    ["destino1", "galpon", "destino2", "galpon2", "destino3", "galpon3", "anioCampana"].forEach((name) => {
      document.querySelector(`[name="${name}"]`).addEventListener("input", actualizarComplexEnVivo);
    });
    ["sexoGalpon", "sexoGalpon2", "sexoGalpon3", "rueda"].forEach((name) => {
      document.querySelector(`[name="${name}"]`).addEventListener("change", actualizarComplexEnVivo);
    });
    sugerirAnioCampana();

    function draw() {
      const viajes = Store.getViajes();
      const hoy = viajes.filter((v) => v.fecha === today);

      document.getElementById("resumen-dia").innerHTML = `
        <div class="grid grid-2" style="gap:10px;">
          <div class="kpi-card"><div class="kpi-label">Viajes hoy</div><div class="kpi-value">${hoy.length}</div></div>
          <div class="kpi-card"><div class="kpi-label">Unidades distintas</div><div class="kpi-value">${new Set(hoy.map(v=>v.unidad)).size}</div></div>
          <div class="kpi-card"><div class="kpi-label">Destinos distintos</div><div class="kpi-value">${new Set(hoy.map(v=>v.destino1)).size}</div></div>
          <div class="kpi-card"><div class="kpi-label">Total pollitos BB</div><div class="kpi-value">${hoy.reduce((a,v)=>a+(+v.cantidad||0),0).toLocaleString("es-PE")}</div></div>
        </div>`;

      document.getElementById("body-viajes").innerHTML = viajes
        .map(
          (v) => `
        <tr>
          <td class="mono">${v.dtSap}</td>
          <td>${Util.fmtFecha(v.fecha)}</td>
          <td>${v.ruta}</td>
          <td>${v.planta}</td>
          <td>${v.destino1}</td>
          <td class="mono">${v.unidad}</td>
          <td class="mono">${v.placa}</td>
          <td>${v.conductor}</td>
          <td class="mono">${Util.fmtHora(v.horaSalidaPlan)}</td>
          <td>${Util.badgeEstado(v.estado)}</td>
          <td class="mono">${[v.complex1, v.complex2, v.complex3].filter(Boolean).join("<br/>") || "—"}</td>
          <td>${Store.destinosGalpones(v).map((p) => checklistBadgeHtml(p.destino, p.galpon)).join(" ") || "—"}</td>
          <td><a class="btn btn-sm btn-ghost" href="viaje.html?id=${v.id}">Ver →</a></td>
        </tr>`
        )
        .join("");
    }

    document.getElementById("form-viaje").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const viaje = Object.fromEntries(fd.entries());
      viaje.producto = "Pollo BB";
      viaje.estado = "Programado";
      viaje.horaSalidaReal = "";
      viaje.horaLlegadaReal = "";
      viaje.complex1 = Store.construirComplex({ destino: viaje.destino1, anio: viaje.anioCampana, rueda: viaje.rueda, galpon: viaje.galpon, sexo: viaje.sexoGalpon });
      viaje.complex2 = Store.construirComplex({ destino: viaje.destino2, anio: viaje.anioCampana, rueda: viaje.rueda, galpon: viaje.galpon2, sexo: viaje.sexoGalpon2 });
      viaje.complex3 = Store.construirComplex({ destino: viaje.destino3, anio: viaje.anioCampana, rueda: viaje.rueda, galpon: viaje.galpon3, sexo: viaje.sexoGalpon3 });
      Store.addViaje(viaje);
      e.target.reset();
      document.querySelector('input[name="fecha"]').value = today;
      actualizarChecklistEnVivo();
      sugerirAnioCampana();
      draw();
    });

    draw();
  };
</script>
<script src="js/nav.js"></script>
</body>
</html>
