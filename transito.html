<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tránsito · GPS · Ciclo Térmico BB</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script>
  window.PAGE = "transito";
  window.PAGE_TITLE = "② Tránsito — GPS y geocercas";
  window.PAGE_SUBTITLE = "Monitoreo de temperatura ambiental de la unidad y cumplimiento de horarios contra geocercas";
</script>

<template id="tpl-content">
  <div class="field" style="max-width:520px;">
    <label>Unidad en ruta</label>
    <select id="select-viaje"></select>
  </div>

  <div id="contenido"></div>
</template>

<template id="tpl-vacio">
  <div class="empty-state">Selecciona una unidad en tránsito (o programada) para ver su seguimiento GPS.</div>
</template>

<script src="js/store.js"></script>
<script src="js/util.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  let chartRef = null;
  let dlLecturas = [];
  let dlLecturaSeq = 1;

  function pintarLecturas() {
    document.getElementById("dl-lecturas-rows").innerHTML = dlLecturas
      .map(
        (l) => `
      <div class="flex gap-8" style="margin-bottom:8px;" data-row="${l._id}">
        <input class="mono min-input" type="number" step="1" placeholder="min" value="${l.min ?? ""}" style="width:80px;" />
        <input class="mono temp-input" type="number" step="0.1" placeholder="Temp °C" value="${l.temp ?? ""}" style="width:110px;" />
        <button class="btn btn-sm btn-ghost" type="button" data-remove="${l._id}">✕</button>
      </div>`
      )
      .join("");

    document.querySelectorAll("#dl-lecturas-rows .min-input").forEach((inp, idx) => {
      inp.addEventListener("input", () => { dlLecturas[idx].min = inp.value !== "" ? parseFloat(inp.value) : null; });
    });
    document.querySelectorAll("#dl-lecturas-rows .temp-input").forEach((inp, idx) => {
      inp.addEventListener("input", () => { dlLecturas[idx].temp = inp.value !== "" ? parseFloat(inp.value) : null; });
    });
    document.querySelectorAll("#dl-lecturas-rows [data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        dlLecturas = dlLecturas.filter((l) => l._id !== btn.getAttribute("data-remove"));
        pintarLecturas();
      });
    });
  }

  function pintar(id) {
    const cont = document.getElementById("contenido");
    const v = Store.getViaje(id);
    if (!v) {
      cont.innerHTML = "";
      cont.appendChild(document.getElementById("tpl-vacio").content.cloneNode(true));
      return;
    }

    const salidaDeltaMin = Util.minutosEntre(v.horaSalidaPlan, v.horaSalidaReal);
    const llegadaDeltaMin = v.horaLlegadaReal ? Util.minutosEntre(v.horaCargaFinPlan, v.horaLlegadaReal) : null;

    // --- Dimensión operativa y logística ---
    const promC = Store.promedio(v.cargaPlanta.muestras.map((m) => m.tempCloacal));
    const promAmb = Store.promedio(v.transito.serie.map((s) => s.temp));
    const promL = v.granja ? Store.promedio(v.granja.muestrasLlegada.map((m) => m.tempCloacal)) : null;
    const variacion = promL != null && promC != null ? promL - promC : null;

    const viajeMin = v.horaSalidaReal && v.horaLlegadaReal ? Util.minutosEntre(v.horaSalidaReal, v.horaLlegadaReal) : null;
    const duracionTexto = viajeMin != null
      ? `${Math.floor(viajeMin / 60)}h ${viajeMin % 60}min`
      : v.horaSalidaReal
        ? `En curso desde ${v.horaSalidaReal}`
        : "Aún no inicia";

    cont.innerHTML = `
      <div class="two-col">
        <div class="card">
          <div class="card-head">
            <h3>${v.dtSap} · ${v.placa} · ${v.destino1}</h3>
            ${Util.badgeEstado(v.estado)}
          </div>
          <div class="geo-steps" id="geo-steps"></div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Cumplimiento horario (prog. vs. GPS)</h3></div>
          <div class="grid grid-2" style="gap:10px;">
            <div class="kpi-card">
              <div class="kpi-label">Salida planta</div>
              <div class="kpi-value ${salidaDeltaMin == null ? "" : salidaDeltaMin > 10 ? "heat" : "cool"}" style="font-size:19px;">
                ${v.horaSalidaReal || "—"} <span class="faint" style="font-size:12px;">/ prog. ${v.horaSalidaPlan}</span>
              </div>
              <div class="kpi-delta">${salidaDeltaMin == null ? "Aún no registrado" : (salidaDeltaMin > 0 ? "+" : "") + salidaDeltaMin + " min vs. programado"}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Llegada a destino</div>
              <div class="kpi-value ${llegadaDeltaMin == null ? "" : llegadaDeltaMin > 15 ? "heat" : "cool"}" style="font-size:19px;">
                ${v.horaLlegadaReal || "En ruta"} <span class="faint" style="font-size:12px;">/ máx. espera ${v.esperaMaxMin || "—"} min</span>
              </div>
              <div class="kpi-delta">${llegadaDeltaMin == null ? "Estimado por geocerca próxima" : (llegadaDeltaMin > 0 ? "+" : "") + llegadaDeltaMin + " min vs. fin de carga prog."}</div>
            </div>
          </div>
          <hr class="divider" />
          <button class="btn btn-primary" id="btn-llegada" ${v.estado !== "En Tránsito" ? "disabled" : ""}>
            Registrar llegada a destino (geocerca)
          </button>
          <p class="faint" style="font-size:12px; margin-top:8px;">
            ${v.estado === "En Tránsito" ? "Se detecta cruce de geocerca de llegada para registrar el arribo." : "Disponible cuando la unidad esté en tránsito."}
          </p>
        </div>
      </div>

      <div class="section-title"><span class="eyebrow">LOGÍSTICA</span> Dimensión operativa y logística</div>
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h3>Temperaturas y variación térmica</h3></div>
          <div class="grid grid-4" style="gap:10px;">
            <div class="kpi-card">
              <div class="kpi-label">Salida planta</div>
              <div class="kpi-value">${promC != null ? promC.toFixed(1) + "°C" : "—"}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Tránsito (amb.)</div>
              <div class="kpi-value">${promAmb != null ? promAmb.toFixed(1) + "°C" : "—"}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Llegada granja</div>
              <div class="kpi-value">${promL != null ? promL.toFixed(1) + "°C" : "—"}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Variación térmica</div>
              <div class="kpi-value ${variacion != null && Math.abs(variacion) > 0.6 ? "heat" : "cool"}">${variacion != null ? (variacion > 0 ? "+" : "") + variacion.toFixed(1) + "°C" : "—"}</div>
            </div>
          </div>
          <hr class="divider" />
          <div class="kpi-label">Tiempos de transporte</div>
          <div class="kpi-value" style="font-size:19px; margin-top:4px;">${duracionTexto}</div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Eventos del viaje</h3></div>
          <div id="eventos-lista" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;"></div>
          <div class="flex gap-8" style="align-items:flex-end;">
            <div class="field" style="margin-bottom:0; width:110px;"><label>Hora</label><input class="mono" type="time" id="ev-hora" /></div>
            <div class="field" style="margin-bottom:0; flex:1;"><label>Descripción</label><input id="ev-desc" placeholder="Parada no programada, alerta térmica…" /></div>
            <button class="btn btn-sm" id="btn-add-evento" type="button" style="height:38px;">+ Registrar</button>
          </div>
        </div>
      </div>

      <div class="section-title"><span class="eyebrow">VALIDACIÓN</span> Contraste con datalogger independiente</div>
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h3>Registro del datalogger</h3><span class="hint">Complementa al sensor del proveedor</span></div>
          <div class="grid grid-2">
            <div class="field"><label>Fuente de datos</label>
              <select id="dl-fuente">
                <option value="">Sin datos aún</option>
                <option value="tiempo_real">Tiempo real (IoT)</option>
                <option value="manual">Registro manual (descarga post-viaje)</option>
              </select>
            </div>
            <div class="field"><label>ID del datalogger</label><input class="mono" id="dl-dispositivo" placeholder="DL-2201" /></div>
            <div class="field"><label>Registrado por</label><input id="dl-registrado-por" placeholder="Nombre / área (si es manual)" /></div>
            <div class="field"><label>Hora de registro / descarga</label><input class="mono" type="time" id="dl-hora" /></div>
          </div>
          <div class="flex-between" style="margin:6px 0 10px;">
            <h3 style="font-size:13px;">Lecturas del datalogger (minuto, temp. °C)</h3>
            <button class="btn btn-sm" id="btn-add-lectura" type="button">+ Agregar lectura</button>
          </div>
          <div id="dl-lecturas-rows"></div>
          <button class="btn btn-primary" style="margin-top:12px;" id="btn-guardar-datalogger" type="button">Guardar datos del datalogger</button>
          <p class="faint" id="msg-datalogger" style="margin-top:8px; font-size:12px;"></p>
        </div>

        <div class="card">
          <div class="card-head"><h3>Resultado del contraste</h3></div>
          <div id="dl-contraste"></div>
        </div>
      </div>

      <div class="section-title"><span class="eyebrow">SENSOR</span> Temperatura ambiente: sensor del proveedor vs. datalogger</div>
      <div class="card">
        ${v.transito.serie.length
          ? `<canvas id="chart-temp" height="80"></canvas>`
          : `<div class="empty-state">Aún no hay lecturas de sensores para esta unidad.</div>`}
      </div>
    `;

    // Geocercas
    const geoCont = document.getElementById("geo-steps");
    geoCont.innerHTML = v.geocercas
      .map((g, i) => {
        const cruzada = g.estado === "Cruzada";
        return `
        <div class="geo-step ${cruzada ? "cruzada" : "pendiente"}">
          <div class="rail">
            <div class="node"></div>
            ${i < v.geocercas.length - 1 ? '<div class="line"></div>' : ""}
          </div>
          <div class="content">
            <div class="name">${g.nombre}</div>
            <div class="time">${cruzada ? "Cruzada · " + g.hora : "Pendiente"}</div>
          </div>
        </div>`;
      })
      .join("");

    // Chart temp ambiente: sensor del proveedor vs. datalogger (envuelto en
    // try/catch: si Chart.js no cargó —p.ej. sin conexión al CDN en planta/
    // campo— el resto de la página sigue funcionando)
    function dibujarChart() {
      if (!v.transito.serie.length) return;
      try {
        const ctx = document.getElementById("chart-temp");
        if (chartRef) chartRef.destroy();
        const datalog = v.transito.datalogger;
        const datasets = [
          {
            label: "Sensor proveedor (°C)",
            data: v.transito.serie.map((s) => s.temp),
            borderColor: "#2f93c4",
            backgroundColor: "#2f93c422",
            tension: 0.35,
            fill: true,
            pointRadius: 3,
            pointBackgroundColor: "#2f93c4",
          },
        ];
        if (datalog?.serie?.length) {
          datasets.push({
            label: "Datalogger (°C)",
            data: datalog.serie.map((s) => s.temp),
            borderColor: "#e2231a",
            backgroundColor: "#e2231a00",
            borderDash: [6, 4],
            tension: 0.35,
            fill: false,
            pointRadius: 3,
            pointBackgroundColor: "#e2231a",
          });
        }
        chartRef = new Chart(ctx, {
          type: "line",
          data: { labels: v.transito.serie.map((s) => `min ${s.min}`), datasets },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: "#5c7396", font: { family: "Nunito Sans" } } } },
            scales: {
              x: { ticks: { color: "#93a8c4" }, grid: { color: "#e7eff8" } },
              y: { ticks: { color: "#93a8c4" }, grid: { color: "#e7eff8" }, suggestedMin: 27, suggestedMax: 34 },
            },
          },
        });
      } catch (err) {
        console.error("No se pudo dibujar el gráfico de temperatura (Chart.js):", err);
      }
    }
    dibujarChart();

    document.getElementById("btn-llegada")?.addEventListener("click", () => {
      const hora = new Date().toTimeString().slice(0, 5);
      const nuevasGeo = v.geocercas.map((g, i) => (i === v.geocercas.length - 1 ? { ...g, hora, estado: "Cruzada" } : g));
      Store.updateViaje(v.id, { estado: "En Granja", horaLlegadaReal: hora, geocercas: nuevasGeo });
      window.location.href = "granja.html?id=" + v.id;
    });

    // Eventos del viaje
    const eventosLista = document.getElementById("eventos-lista");
    function pintarEventos(eventos) {
      eventosLista.innerHTML = eventos.length
        ? eventos
            .map((e) => `<div style="font-size:12.5px;"><span class="mono faint">${e.hora || "—"}</span> · ${e.descripcion}</div>`)
            .join("")
        : `<div class="faint" style="font-size:12.5px;">Sin eventos registrados.</div>`;
    }
    pintarEventos(v.transito.eventos || []);

    document.getElementById("btn-add-evento").addEventListener("click", () => {
      const desc = document.getElementById("ev-desc").value.trim();
      if (!desc) return;
      const hora = document.getElementById("ev-hora").value || new Date().toTimeString().slice(0, 5);
      const eventos = [...(v.transito.eventos || []), { hora, descripcion: desc }];
      Store.updateViaje(v.id, { transito: { ...v.transito, eventos } });
      v.transito.eventos = eventos;
      pintarEventos(eventos);
      document.getElementById("ev-desc").value = "";
      document.getElementById("ev-hora").value = "";
    });

    // Contraste con datalogger
    const dl0 = v.transito.datalogger || { fuente: null, dispositivoId: "", registradoPor: "", horaRegistro: "", serie: [] };
    document.getElementById("dl-fuente").value = dl0.fuente || "";
    document.getElementById("dl-dispositivo").value = dl0.dispositivoId || "";
    document.getElementById("dl-registrado-por").value = dl0.registradoPor || "";
    document.getElementById("dl-hora").value = dl0.horaRegistro || "";

    dlLecturas = (dl0.serie || []).map((l) => ({ _id: "dl" + dlLecturaSeq++, min: l.min, temp: l.temp }));
    if (!dlLecturas.length) {
      dlLecturas = [1, 2, 3].map(() => ({ _id: "dl" + dlLecturaSeq++, min: null, temp: null }));
    }
    pintarLecturas();

    function pintarContraste() {
      const cont = document.getElementById("dl-contraste");
      const dl = v.transito.datalogger || {};
      const resultado = Store.contrastarDatalogger(v.transito.serie, dl.serie || []);
      if (!resultado) {
        cont.innerHTML = `<div class="empty-state">Aún no hay datos del datalogger para contrastar.</div>`;
        return;
      }
      cont.innerHTML = `
        <div class="grid grid-2" style="gap:10px;">
          <div class="kpi-card">
            <div class="kpi-label">Prom. sensor proveedor</div>
            <div class="kpi-value">${resultado.promSensor.toFixed(1)}°C</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Prom. datalogger</div>
            <div class="kpi-value">${resultado.promDatalogger.toFixed(1)}°C</div>
          </div>
        </div>
        <hr class="divider" />
        <div class="kpi-label">Δ contraste (datalogger − sensor)</div>
        <div class="kpi-value ${resultado.consistente ? "cool" : "heat"}" style="font-size:22px; margin:4px 0 8px;">
          ${resultado.delta > 0 ? "+" : ""}${resultado.delta.toFixed(2)}°C
        </div>
        <span class="badge ${resultado.consistente ? "optimo" : "critico"}">${resultado.consistente ? "Sensores consistentes" : "Discrepancia detectada"}</span>
        <p class="faint" style="font-size:11.5px; margin-top:8px;">Tolerancia admitida: ±${Store.TOLERANCIA_DATALOGGER_C}°C · Fuente: ${dl.fuente === "manual" ? "registro manual" : dl.fuente === "tiempo_real" ? "tiempo real (IoT)" : "—"}</p>
      `;
    }
    pintarContraste();

    document.getElementById("btn-add-lectura").addEventListener("click", () => {
      dlLecturas.push({ _id: "dl" + dlLecturaSeq++, min: null, temp: null });
      pintarLecturas();
    });

    document.getElementById("btn-guardar-datalogger").addEventListener("click", () => {
      const serie = dlLecturas
        .filter((l) => l.min != null && l.temp != null)
        .sort((a, b) => a.min - b.min)
        .map((l) => ({ min: l.min, temp: l.temp }));
      const nuevoDatalogger = {
        fuente: document.getElementById("dl-fuente").value || null,
        dispositivoId: document.getElementById("dl-dispositivo").value,
        registradoPor: document.getElementById("dl-registrado-por").value,
        horaRegistro: document.getElementById("dl-hora").value,
        serie,
      };
      Store.updateViaje(v.id, { transito: { ...v.transito, datalogger: nuevoDatalogger } });
      v.transito.datalogger = nuevoDatalogger;
      document.getElementById("msg-datalogger").textContent = "✓ Datos del datalogger guardados — " + new Date().toLocaleTimeString("es-PE");
      pintarContraste();
      dibujarChart();
    });
  }

  window.initPage = function () {
    document.getElementById("page-content").appendChild(
      document.getElementById("tpl-content").content.cloneNode(true)
    );
    const select = document.getElementById("select-viaje");
    Util.fillSelectViajes(select, Store.getViajes(), { placeholder: "Selecciona una unidad…" });

    const preId = Util.qs("id");
    const inicial = preId || (Store.getViajes().find((v) => v.estado === "En Tránsito") || {}).id || "";
    select.value = inicial;
    pintar(inicial);

    select.addEventListener("change", () => pintar(select.value));
  };
</script>
<script src="js/nav.js"></script>
</body>
</html>
